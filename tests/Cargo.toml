[package]
name = "tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
lazy_static = "1.5.0"
rstest = "0.26.1"
tracing = "0.1.44"
test-log = { version = "0.2.21", features = ["trace"] }
embedded-graphics = { workspace = true }
embedded-graphics-simulator = { version = "0.8.0", default-features = false }
rand = { workspace = true, default-features = true }
pico-display = { path = "../crates/pico-display" }
game-logic = { path = "../crates/game-logic" }
rp2350-sensor-hub = { path = "..", default-features = false }
tokio = { version = "1.53.0", features = ["full"] }
reqwless = { workspace = true }
std-embedded-nal-async = "0.4.0"
embassy-sync = { version = "0.8.0", features = ["defmt", "std"] }
static_cell = "2.1.1"
wiremock = "0.6.5"

[[test]]
name = "test-die"
path = "test_die.rs"

[[test]]
name = "test-player"
path = "test_player.rs"

[[test]]
name = "test-game"
path = "test_game.rs"

[[test]]
name = "test-game-logic"
path = "test_game_logic.rs"

[[test]]
name = "test-network"
path = "test_network.rs"

[features]
default = ["sdl2"]
sdl2 = ["embedded-graphics-simulator/with-sdl"]
