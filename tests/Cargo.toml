edition = "2021"
publish = false

[dev-dependencies]
lazy_static = "1.5.0"
rstest = "0.26.1"
tracing = "0.1.44"
test-log = { version = "0.2.21", features = ["trace"] }
embedded-graphics = { workspace = true }
