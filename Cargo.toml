[workspace]
members = ["crates/*", "tests"]

[package]
edition = "2024"
name = "rp2350-sensor-hub"
version = "0.1.0"
license = "MIT OR Apache-2.0"
exclude = ["axum-server/"]

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", optional = true }
embedded-hal = "1.0.0"

defmt = { workspace = true }
defmt-rtt = { workspace = true }

display-interface = "0.5.0"
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
], optional = true }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "proto-ipv4",
  "tcp",
] }
embassy-rp = { version = "0.10.0", features = [
  "defmt",
  "binary-info",
  "unstable-pac",
  "time-driver",
  "critical-section-impl",
  "rp235xa",
], optional = true }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { workspace = true }
embedded-alloc = "0.7.0"
embedded-graphics = { workspace = true }
embedded-graphics-framebuf = "0.5.0"
embedded-nal-async = "0.9.0"
panic-probe = { version = "1", features = ["print-defmt"] }
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
rand = { workspace = true }
reqwless = { workspace = true }
ssd1306 = { version = "0.10.0", features = ["async"] }
static_cell = "2.1.1"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"
u8g2-fonts = { workspace = true }

game-logic = { path = "./crates/game-logic" }
pico-display = { path = "./crates/pico-display" }
embassy-dht-rp2350-sensor = { path = "./crates/embassy-dht-rp2350-sensor", optional = true }

[workspace.dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.6"
embedded-graphics = "0.8.1"
rand = { version = "0.10.2", default-features = false }
u8g2-fonts = "0.8.0"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-time = { version = "0.5.1", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }
reqwless = "0.14.0"

# cargo build/run
[profile.dev]
debug = 2
debug-assertions = true
opt-level = 2
overflow-checks = true

# cargo build/run --release
[profile.release]
debug = 2
debug-assertions = false
lto = 'fat'
opt-level = 2
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
debug = false
debug-assertions = false
overflow-checks = false
opt-level = 0

[profile.release.build-override]
debug = false
debug-assertions = false
overflow-checks = false
opt-level = 0

# cargo test
[profile.test]
debug = 2
debug-assertions = true
opt-level = 2
overflow-checks = true

# cargo test --release
[profile.bench]
debug = 2
debug-assertions = false
lto = 'fat'
opt-level = 3

[features]
default = ["board"]
temperature = ["embassy-dht-rp2350-sensor"]
board = [
  "embassy-rp",
  "embassy-executor",
  "cyw43-pio",
]
